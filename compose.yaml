services:
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment: &entorno_backend
      POSTGRES_DB: fcc_academica
      POSTGRES_USER: fcc_dev
      POSTGRES_PASSWORD: fcc_dev_local
    depends_on:
      - db

  worker_programacion:
    build: ./backend
    command: python -u manage.py procesar_generacion --continuo
    volumes:
      - ./backend:/app
    environment: *entorno_backend
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --strictPort
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fcc_academica
      POSTGRES_USER: fcc_dev
      POSTGRES_PASSWORD: fcc_dev_local
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  frontend_node_modules: